schema_version: "3.0"
artifacts:
  - name: "geometric_shape"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.generators.GeometricShapeGenerator"
    description: "Generates generic geometric shapes."
  - name: "geometric_eo_injector"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.injectors.GeometricEOInjector"
    description: "Injects geometric shapes into EO chips."
  - name: "geometric_sar_injector"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.injectors.GeometricSARInjector"
    description: "Injects geometric shapes into SAR chips."
  - name: "geojson_writer"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.annotations.GeoJSONWriter"
    description: "Writes annotations to GeoJSON."
  - name: "coco_writer"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.annotations.COCOWriter"
    description: "Writes annotations to COCO JSON."
  - name: "yolo_writer"
    version: "0.1.0"
    artifact_type: "grdl_processor"
    processor_class: "grdl.synthetic.annotations.YOLOWriter"
    description: "Writes annotations to YOLO text."
